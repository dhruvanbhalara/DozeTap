name: Feature Request
description: Suggest an idea or feature enhancement for DozeTap
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a suggestion for improving DozeTap? We would love to hear your ideas!

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a problem or missing workflow?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
      placeholder: Describe UI / UX or tile behavior improvements...
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
