name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDevDebug lintProdRelease --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDevDebugUnitTest testProdReleaseUnitTest testProdDebugUnitTest testDevReleaseUnitTest --no-daemon

      - name: Build Debug & Release (Unsigned)
        run: ./gradlew assembleDevDebug assembleProdRelease --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DozeTap-APKs
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
